services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacms_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped

